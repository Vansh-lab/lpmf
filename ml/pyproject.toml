[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lpmf"
version = "0.1.0"
description = "LPMF — ML ingestion, cleaning, feature, modelling, and engine package for the Delhi grid load-intelligence dashboard"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "requests>=2.31",
  "holidays>=0.47",
  "pandera>=0.19",
  "pydantic>=2.6",
  "matplotlib>=3.8",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "lightgbm>=4.5",
  "optuna>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "black>=24.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
